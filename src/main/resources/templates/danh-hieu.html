<!-- Script điều khiển Modal & Call API cho Danh hiệu -->
<script>
    let globalTypesData = [];
    let dataTableInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
        loadTableData();

        // Sự kiện preview ảnh khi nhập link
        document.getElementById('linkImg').addEventListener('input', function(e) {
            const url = e.target.value.trim();
            const container = document.getElementById('imgPreviewContainer');
            const img = document.getElementById('imgPreview');
            if(url) {
                img.src = url;
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        });
    });

    // 1. Load dữ liệu và khởi tạo Bảng
    function loadTableData() {
        fetch(API_BASE_URL + '/api/types')
            .then(response => response.json())
            .then(data => {
                globalTypesData = data;

                if (dataTableInstance) {
                    dataTableInstance.destroy();
                }

                const tbody = document.getElementById("typeTableBody");
                tbody.innerHTML = "";

                data.forEach(item => {
                    // Cải tiến: Nếu không có link ảnh thì không hiện thẻ img
                    let imgHtml = '';
                    if (item.linkImg && item.linkImg.trim() !== '') {
                        imgHtml = `<img src="${item.linkImg}" alt="Danh hiệu" style="max-height: 50px; border-radius: 8px; object-fit: cover;" referrerpolicy="no-referrer">`;
                    }

                    const row = `
            <tr>
              <td><p class="text-sm font-weight-bold mb-0 ps-3">${item.typeId}</p></td>
              <td><p class="text-sm font-weight-bold mb-0">${item.memberId}</p></td>
              <td class="align-middle text-center">
                ${imgHtml}
              </td>
              <td class="align-middle text-center">
                <a href="javascript:;" class="text-secondary font-weight-bold text-xs me-3"
                   data-bs-toggle="modal" data-bs-target="#typeModal"
                   onclick="editType('${item.typeId}', '${item.memberId}', '${item.linkImg || ''}')">
                  Sửa
                </a>
                <a href="javascript:;" class="text-danger font-weight-bold text-xs"
                   onclick="deleteType('${item.typeId}')">
                  Xóa
                </a>
              </td>
            </tr>
          `;
                    tbody.innerHTML += row;
                });

                // KÍCH HOẠT DATATABLE
                dataTableInstance = $('#typeTable').DataTable({
                    "language": {
                        "search": "Tìm kiếm nhanh:",
                        "lengthMenu": "Hiển thị _MENU_ danh hiệu",
                        "info": "Đang xem _START_ đến _END_ trong tổng số _TOTAL_ danh hiệu",
                        "paginate": { "next": "Sau", "previous": "Trước" }
                    }
                });
            })
            .catch(error => console.error('Lỗi khi load danh sách danh hiệu:', error));
    }

    // 2. Reset Form Thêm mới
    function resetForm() {
        document.getElementById("typeModalLabel").innerText = "Thêm danh hiệu mới";
        document.getElementById("frmR81DmType").reset();
        document.getElementById('imgPreviewContainer').style.display = 'none';

        const idInput = document.getElementById("typeId");
        idInput.readOnly = false; // Thêm mới thì cho phép nhập/sửa

        let maxNum = 0;
        globalTypesData.forEach(item => {
            if (item.typeId && item.typeId.toUpperCase().startsWith("DH")) {
                let numPart = parseInt(item.typeId.substring(2));
                if (!isNaN(numPart) && numPart > maxNum) {
                    maxNum = numPart;
                }
            }
        });
        const nextNum = maxNum + 1;
        idInput.value = "DH" + String(nextNum).padStart(3, '0');
    }

    // 3. Đổ dữ liệu vào Form khi Sửa
    function editType(typeId, memberId, linkImg) {
        document.getElementById("typeModalLabel").innerText = "Cập nhật danh hiệu";

        const idInput = document.getElementById("typeId");
        idInput.value = typeId;
        idInput.readOnly = true; // KHÓA LẠI - Không cho phép sửa mã danh hiệu như cũ

        document.getElementById("memberId").value = memberId;
        document.getElementById("linkImg").value = linkImg;

        // Cải tiến: Ẩn hiện preview ảnh
        const container = document.getElementById('imgPreviewContainer');
        const img = document.getElementById('imgPreview');
        if(linkImg && linkImg.trim() !== '') {
            img.src = linkImg;
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    // 4. Lưu dữ liệu
    function saveType() {
        const idInput = document.getElementById("typeId");
        const typeId = idInput.value.trim();
        const isEditMode = idInput.readOnly; // Nhận biết đang Sửa dựa vào trạng thái ReadOnly

        if (!typeId) {
            alert("Lỗi: Mã danh hiệu không được để trống!");
            idInput.focus();
            return;
        }

        const requestData = {
            typeId: typeId,
            memberId: document.getElementById("memberId").value,
            linkImg: document.getElementById("linkImg").value
        };

        const apiMethod = isEditMode ? 'PUT' : 'POST';
        const apiUrl = isEditMode ? `${API_BASE_URL}/api/types/${typeId}` : `${API_BASE_URL}/api/types`;

        fetch(apiUrl, {
            method: apiMethod,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
            .then(async response => {
                if(response.ok) {
                    alert(isEditMode ? "Cập nhật thành công!" : "Thêm danh hiệu thành công!");
                    const modal = bootstrap.Modal.getInstance(document.getElementById('typeModal'));
                    modal.hide();
                    loadTableData();
                } else {
                    // CẢI TIẾN: Bắt và hiện luôn mã lỗi để dễ debug
                    const errMsg = await response.text();
                    alert(`Thao tác thất bại!\nMã lỗi Http: ${response.status}\nChi tiết: ${errMsg || "Có thể do Mã Thành Viên không tồn tại (Lỗi khóa ngoại) hoặc do CORS."}`);
                }
            })
            .catch(error => {
                console.error('Lỗi khi lưu:', error);
                alert("Lỗi kết nối tới Server. Xem F12 (Console) để biết thêm chi tiết.");
            });
    }

    // 5. Xóa dữ liệu
    function deleteType(typeId) {
        if(confirm(`Bạn có chắc chắn muốn xóa danh hiệu mã ${typeId} không?`)) {
            fetch(`${API_BASE_URL}/api/types/${typeId}`, { method: 'DELETE' })
                .then(response => {
                    if(response.ok) {
                        alert("Xóa thành công!");
                        loadTableData();
                    } else {
                        alert("Lỗi khi xóa danh hiệu!");
                    }
                })
                .catch(error => console.error('Lỗi API xóa:', error));
        }
    }
</script>

            window.location.href = 'index_2.html'; // Chuyển về trang chủ
        }
    }
</script>
